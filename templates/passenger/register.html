{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <h2>Create Passenger Account</h2>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button class="button" type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
